name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: App/package-lock.json

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match package.json version $version" }

      - name: Write the empty oauth.json (users add their own keys in the app)
        shell: pwsh
        run: |
          Set-Content -Path oauth.json -Encoding utf8 -Value '{ "googleClientId": "", "googleClientSecret": "", "microsoftClientId": "", "microsoftTenant": "common" }'

      - run: npm ci

      - name: Build the installer
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - run: npm test

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: DHMail ${{ github.ref_name }}
          generate_release_notes: true
          files: App/release/DHMail-Setup-*.exe
          body: |
            **Install or update:** download `DHMail-Setup-${{ github.ref_name }}.exe` below and double-click it.
            If DHMail is already installed, it is closed and updated in place. Your accounts, mail, settings and PIN are kept.

      - name: Keep the files (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: DHMail-windows
          path: App/release/DHMail-Setup-*.exe

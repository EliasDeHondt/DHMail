############################
# Builds the Windows installer and the portable exe and publishes them as a GitHub Release.
# Start it by pushing a version tag that matches App/package.json, e.g.:
#   git tag v1.26.0 && git push origin v1.26.0
# No secrets needed: oauth.json ships empty, users set up their own Google/Microsoft keys.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: App
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: App/package-lock.json

      - name: Check that the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match package.json version $version" }

      - name: Write the empty oauth.json (users add their own keys in the app)
        shell: pwsh
        run: Set-Content -Path oauth.json -Encoding utf8 -Value '{ "googleClientId": "", "googleClientSecret": "", "microsoftClientId": "", "microsoftTenant": "common" }'

      - run: npm ci

      - name: Build installer and portable exe
        run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - run: npm test

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: DHMail ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            App/release/DHMail-*-x64.exe
            App/release/DHMail-*-x64.exe.blockmap
            App/release/DHMail-*-portable.exe

      - name: Keep the files (manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: DHMail-windows
          path: |
            App/release/DHMail-*-x64.exe
            App/release/DHMail-*-portable.exe

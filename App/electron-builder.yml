appId: com.eliasdehondt.dhmail
productName: DHMail
copyright: Copyright © Elias De Hondt
directories:
  output: release
  buildResources: build
files:
  - dist/main/**/*
  - dist/renderer/browser/**/*
  - package.json
extraResources:
  - from: oauth.json
    to: oauth.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  icon: build/icon.png
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DHMail
  uninstallDisplayName: DHMail
  include: build/installer.nsh
portable:
  artifactName: ${productName}-${version}-portable.${ext}
appId: com.eliasdehondt.dhmail
productName: DHMail
copyright: Copyright © Elias De Hondt
directories:
  output: release
  buildResources: build
files:
  - dist/main/**/*
  - dist/renderer/browser/**/*
  - package.json
extraResources:
  - from: oauth.json
    to: oauth.json
asar: true
win:
  # one file for users: the installer (it also updates an existing installation)
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.png
  artifactName: ${productName}-Setup-v${version}.${ext}
nsis:
  oneClick: true
  perMachine: false
  runAfterFinish: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DHMail
  uninstallDisplayName: DHMail
  include: build/installer.nsh
  differentialPackage: false
  # the installer always speaks English
  installerLanguages:
    - en_US
  language: '1033'
  multiLanguageInstaller: false
